name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  helper:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build helper
        run: swift build -c release
        working-directory: helper
      - name: Assemble app bundle
        run: |
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" bash scripts/build-app.sh
          test -x "$TMP_HOME/Applications/Devin Computer Use.app/Contents/MacOS/DevinComputerUseHelper"
